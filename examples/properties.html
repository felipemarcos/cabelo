<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Properties Test</title>
  <link rel="stylesheet" href="styles.css">

  <style>
    .stage {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      align-items: center;
      justify-items: center;
      gap: 24px;
      padding: 48px 16px;
    }

    /* Everything in this card is driven by a single CSS variable */
    .card {
      --progress: 0;
      width: 160px;
      height: 160px;
      border-radius: calc(var(--progress) * 50%);
      background-color: hsl(calc(230 + var(--progress) * 110), 60%, 50%);
      transform: rotate(calc(var(--progress) * 180deg));
    }

    .counter {
      font-size: 64px;
      font-variant-numeric: tabular-nums;
    }

    circle {
      fill: none;
      stroke: #3F51B5;
      stroke-width: 8;
    }

    .shadow {
      width: 160px;
      height: 160px;
      border-radius: 12px;
      background-color: #fff;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="card"></div>

    <span class="counter">0</span>

    <svg width="160" height="160" viewBox="0 0 160 160">
      <circle cx="80" cy="80" r="70" stroke-dasharray="440" stroke-dashoffset="440" />
    </svg>

    <div class="shadow"></div>
  </div>

  <span class="scroll-position">0</span>

  <script src="../dist/cabelo.js"></script>
  <script>
    // Plain objects can be animated too, e.g. to drive a canvas or WebGL scene
    const state = { zoom: 1 };

    cabelo()
      .add({
        targets: '.card',
        duration: [0, 2000],
        '--progress': [0, 1]
      })
      .add({
        targets: '.counter',
        duration: [0, 2000],
        textContent: [0, 2000],
        round: true
      })
      .add({
        targets: 'circle',
        duration: [0, 2000],
        'stroke-dashoffset': [440, 0],
        easing: 'ease-in-out'
      })
      .add({
        targets: '.shadow',
        duration: [0, 2000],
        boxShadow: ['0 0 0 0 rgba(63, 81, 181, 0)', '0 20px 40px 8px #E91E63']
      })
      .add({
        targets: state,
        duration: [0, 2000],
        zoom: [1, 3]
      })
      .on('update', ({ scrollTop }) => {
        document.querySelector('.scroll-position').textContent = `${scrollTop} (zoom: ${state.zoom.toFixed(2)})`;
      })
      .init();
  </script>
</body>
</html>
